name: CI

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────
  # 変更検出: ドキュメントのみの変更かどうかを判定
  # ──────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: detect
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          CODE_CHANGED="false"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|*.md|.claude/*|.githooks/*|.mainignore) ;;
              *) CODE_CHANGED="true"; break ;;
            esac
          done <<< "$CHANGED"
          echo "code_changed=$CODE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "Code changed: $CODE_CHANGED"
          echo "Changed files:"
          echo "$CHANGED"

  # ──────────────────────────────────────────────
  # Claude Code hooks: シェルテスト（常時実行 — .claude/ 変更は
  # code_changed=false になるため、このジョブだけは変更検出に依らず回す）
  # ──────────────────────────────────────────────
  hooks-test:
    name: Claude hooks tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run hook tests
        run: |
          set -e
          for f in .claude/hooks/tests/*.test.sh; do
            echo "=== $f"
            bash "$f"
          done

  # ──────────────────────────────────────────────
  # TypeScript: format + 型チェック + ユニットテスト
  # ──────────────────────────────────────────────
  ts-typecheck-and-test:
    name: TypeScript lint, typecheck & test
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: needs.changes.outputs.code_changed == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
        if: needs.changes.outputs.code_changed == 'true'

      - name: Prettier check
        if: needs.changes.outputs.code_changed == 'true'
        run: scripts/lint.sh jupyter-mcp document-mcp mcp-shared jupyterlab-ai-sync

      - name: Build mcp-shared
        if: needs.changes.outputs.code_changed == 'true'
        run: npm -w packages/mcp-shared run build

      - name: Typecheck
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          npx -w jupyter-mcp tsc --noEmit
          npx -w document-mcp tsc --noEmit

      - name: Unit tests
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          npm -w jupyter-mcp test
          npm -w document-mcp test

      - name: Skip (docs-only change)
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Skipped — docs-only change"

  # ──────────────────────────────────────────────
  # Python: format + lint + 型チェック + ユニットテスト
  # ──────────────────────────────────────────────
  python-lint-and-test:
    name: Python lint, typecheck & test
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: needs.changes.outputs.code_changed == 'true'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: needs.changes.outputs.code_changed == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        if: needs.changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      # 依存はすべてルート venv（uv.lock）で固定する。pip での並行インストールは
      # バージョンドリフト（pytest-asyncio 更新による破壊等）を招くため行わない。
      - name: Sync root venv (uv)
        if: needs.changes.outputs.code_changed == 'true'
        run: uv sync

      - name: Ruff format + lint check
        if: needs.changes.outputs.code_changed == 'true'
        run: scripts/lint.sh document-server jupyter-server scripts

      - name: Mypy (document-server)
        if: needs.changes.outputs.code_changed == 'true'
        run: uv run mypy document-server/src

      - name: Test document-server
        if: needs.changes.outputs.code_changed == 'true'
        working-directory: document-server
        run: uv run --project .. pytest

      - name: Test jupyter-server
        if: needs.changes.outputs.code_changed == 'true'
        working-directory: jupyter-server
        run: uv run --project .. pytest

      - name: Skip (docs-only change)
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Skipped — docs-only change"

  # ──────────────────────────────────────────────
  # JupyterLab AI Sync: ビルド検証
  # ──────────────────────────────────────────────
  jupyterlab-ai-sync-build:
    name: JupyterLab AI Sync build
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: needs.changes.outputs.code_changed == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: needs.changes.outputs.code_changed == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # JupyterLab はルート venv（uv.lock）のものを使う（pip 直インストールの
      # バージョンドリフトを防ぐ）。ビルドは python-uv.md のルールに従い
      # --project .. でルート venv を明示する
      - name: Install uv
        if: needs.changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Sync root venv (uv)
        if: needs.changes.outputs.code_changed == 'true'
        run: uv sync

      - name: Install and build
        if: needs.changes.outputs.code_changed == 'true'
        working-directory: jupyterlab-ai-sync
        run: |
          npm ci
          uv run --project .. npm run build

      - name: Skip (docs-only change)
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Skipped — docs-only change"

  # ──────────────────────────────────────────────
  # 統合テスト（機能テスト — 必須）
  # ──────────────────────────────────────────────
  integration-test:
    name: Integration test (Docker Compose)
    runs-on: ubuntu-latest
    needs: [changes, ts-typecheck-and-test, python-lint-and-test]
    env:
      DATA_ENV: sample
      POSTGRES_DB: analysis_db
      POSTGRES_USER: jupyter
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_READONLY_PASSWORD: ci-readonly-password
      JUPYTER_TOKEN: ci-test-token
      DOCUMENT_SERVER_TOKEN: ci-document-token
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: needs.changes.outputs.code_changed == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: npm ci

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: needs.changes.outputs.code_changed == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        if: needs.changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Sync root venv (uv)
        if: needs.changes.outputs.code_changed == 'true'
        run: uv sync

      - name: Build MCP servers
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          npm -w packages/mcp-shared run build
          npm -w jupyter-mcp run build
          npm -w document-mcp run build

      - name: Start services
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          docker compose up -d --build --wait
          docker compose ps

      - name: Wait for healthy services
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 30); do
            if docker compose ps | grep -q "unhealthy\|starting"; then
              echo "  attempt $i/30 — waiting..."
              sleep 5
            else
              echo "All services healthy."
              docker compose ps
              exit 0
            fi
          done
          echo "Services did not become healthy in time."
          docker compose ps
          docker compose logs
          exit 1
        timeout-minutes: 5

      - name: Load sample data into PostgreSQL
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          PGHOST=localhost PGPORT=5432 PGUSER=jupyter PGPASSWORD=ci-test-password PGDATABASE=analysis_db \
            uv run python postgres/init/sample/load-data.py

      - name: Run MCP integration tests (excluding performance)
        if: needs.changes.outputs.code_changed == 'true'
        env:
          JUPYTER_SERVER_URL: http://localhost:8888
          DOCUMENT_SERVER_URL: http://localhost:3002
          JUPYTER_TOKEN: ci-test-token
          DOCUMENT_SERVER_TOKEN: ci-document-token
        run: |
          npx -w jupyter-mcp vitest run --config vitest.config.integration.ts --exclude '**/performance.test.ts'
          npx -w document-mcp vitest run --config vitest.config.integration.ts --exclude '**/performance.test.ts'

      - name: Run E2E tests (excluding performance)
        if: needs.changes.outputs.code_changed == 'true'
        env:
          JUPYTER_SERVER_URL: http://localhost:8888
          DOCUMENT_SERVER_URL: http://localhost:3002
          JUPYTER_TOKEN: ci-test-token
          DOCUMENT_SERVER_TOKEN: ci-document-token
        run: npx -w tests/e2e vitest run --exclude '**/performance.test.ts'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Skip (docs-only change)
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Skipped — docs-only change"

  # ──────────────────────────────────────────────
  # npm audit（参考 — 依存の新規公表脆弱性を可視化、失敗しても CI をブロックしない。
  # 脆弱性 DB は日々更新されるため、コード無変更でも赤になりうる → informational）
  # ──────────────────────────────────────────────
  npm-audit:
    name: npm audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # npm audit は package-lock.json のみで動作するため npm ci は不要
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit root workspaces (high 以上)
        run: npm audit --audit-level=high

      - name: Audit jupyterlab-ai-sync (high 以上)
        run: npm --prefix jupyterlab-ai-sync audit --audit-level=high

  # ──────────────────────────────────────────────
  # パフォーマンステスト（参考 — 失敗しても CI をブロックしない）
  # ──────────────────────────────────────────────
  performance-test:
    name: Performance test (informational)
    runs-on: ubuntu-latest
    needs: [changes, integration-test]
    continue-on-error: true
    env:
      DATA_ENV: sample
      POSTGRES_DB: analysis_db
      POSTGRES_USER: jupyter
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_READONLY_PASSWORD: ci-readonly-password
      JUPYTER_TOKEN: ci-test-token
      DOCUMENT_SERVER_TOKEN: ci-document-token
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: needs.changes.outputs.code_changed == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: needs.changes.outputs.code_changed == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        if: needs.changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Sync root venv (uv)
        if: needs.changes.outputs.code_changed == 'true'
        run: uv sync

      - name: Install dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: npm ci

      - name: Build MCP servers
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          npm -w packages/mcp-shared run build
          npm -w jupyter-mcp run build
          npm -w document-mcp run build

      - name: Start services
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          docker compose up -d --build --wait
          docker compose ps

      - name: Wait for healthy services
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 30); do
            if docker compose ps | grep -q "unhealthy\|starting"; then
              echo "  attempt $i/30 — waiting..."
              sleep 5
            else
              echo "All services healthy."
              docker compose ps
              exit 0
            fi
          done
          echo "Services did not become healthy in time."
          docker compose ps
          docker compose logs
          exit 1
        timeout-minutes: 5

      - name: Load sample data into PostgreSQL
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          PGHOST=localhost PGPORT=5432 PGUSER=jupyter PGPASSWORD=ci-test-password PGDATABASE=analysis_db \
            uv run python postgres/init/sample/load-data.py

      - name: Run performance tests
        if: needs.changes.outputs.code_changed == 'true'
        env:
          JUPYTER_SERVER_URL: http://localhost:8888
          DOCUMENT_SERVER_URL: http://localhost:3002
          JUPYTER_TOKEN: ci-test-token
          DOCUMENT_SERVER_TOKEN: ci-document-token
        run: |
          npx -w jupyter-mcp vitest run --config vitest.config.integration.ts tests/integration/performance.test.ts || true
          npx -w document-mcp vitest run --config vitest.config.integration.ts tests/integration/performance.test.ts || true
          npx -w tests/e2e vitest run tests/e2e/performance.test.ts || true

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Skip (docs-only change)
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Skipped — docs-only change"
