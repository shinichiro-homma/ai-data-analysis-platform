name: CI

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────
  # 変更検出: ドキュメントのみの変更かどうかを判定
  # ──────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: detect
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          CODE_CHANGED="false"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|*.md|.claude/*) ;;
              *) CODE_CHANGED="true"; break ;;
            esac
          done <<< "$CHANGED"
          echo "code_changed=$CODE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "Code changed: $CODE_CHANGED"
          echo "Changed files:"
          echo "$CHANGED"

  # ──────────────────────────────────────────────
  # TypeScript: format + 型チェック + ユニットテスト
  # ──────────────────────────────────────────────
  ts-typecheck-and-test:
    name: TypeScript lint, typecheck & test
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code_changed == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
        if: needs.changes.outputs.code_changed == 'true'

      - name: Prettier check
        if: needs.changes.outputs.code_changed == 'true'
        run: npx prettier --check "jupyter-mcp/src/**/*.ts" "document-mcp/src/**/*.ts" "packages/mcp-shared/src/**/*.ts"

      - name: Build mcp-shared
        if: needs.changes.outputs.code_changed == 'true'
        run: npm -w packages/mcp-shared run build

      - name: Typecheck
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          npx -w jupyter-mcp tsc --noEmit
          npx -w document-mcp tsc --noEmit

      - name: Unit tests
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          npm -w jupyter-mcp test
          npm -w document-mcp test

      - name: Skip (docs-only change)
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Skipped — docs-only change"

  # ──────────────────────────────────────────────
  # Python: format + lint + 型チェック + ユニットテスト
  # ──────────────────────────────────────────────
  python-lint-and-test:
    name: Python lint, typecheck & test
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code_changed == 'true'

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.code_changed == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          pip install ruff
          pip install -e "document-server[dev]" types-PyYAML
          pip install pytest pytest-asyncio sqlparse

      - name: Ruff format check
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          ruff format --check document-server/src/ document-server/tests/
          ruff format --check jupyter-server/extensions/ jupyter-server/tests/
          ruff format --check scripts/*.py scripts/lib/*.py

      - name: Ruff lint
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          ruff check document-server/src/ document-server/tests/
          ruff check jupyter-server/extensions/ jupyter-server/tests/
          ruff check scripts/*.py scripts/lib/*.py

      - name: Mypy (document-server)
        if: needs.changes.outputs.code_changed == 'true'
        working-directory: document-server
        run: mypy src/

      - name: Test document-server
        if: needs.changes.outputs.code_changed == 'true'
        working-directory: document-server
        run: pytest

      - name: Test jupyter-server
        if: needs.changes.outputs.code_changed == 'true'
        working-directory: jupyter-server
        run: pytest

      - name: Skip (docs-only change)
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Skipped — docs-only change"

  # ──────────────────────────────────────────────
  # JupyterLab AI Sync: ビルド検証
  # ──────────────────────────────────────────────
  jupyterlab-ai-sync-build:
    name: JupyterLab AI Sync build
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code_changed == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.code_changed == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install JupyterLab
        if: needs.changes.outputs.code_changed == 'true'
        run: pip install jupyterlab>=4.0.0

      - name: Install and build
        if: needs.changes.outputs.code_changed == 'true'
        working-directory: jupyterlab-ai-sync
        run: |
          npm install
          npm run build

      - name: Skip (docs-only change)
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Skipped — docs-only change"

  # ──────────────────────────────────────────────
  # 統合テスト（機能テスト — 必須）
  # ──────────────────────────────────────────────
  integration-test:
    name: Integration test (Docker Compose)
    runs-on: ubuntu-latest
    needs: [changes, ts-typecheck-and-test, python-lint-and-test]
    env:
      DATA_ENV: sample
      POSTGRES_DB: analysis_db
      POSTGRES_USER: jupyter
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_READONLY_PASSWORD: ci-readonly-password
      JUPYTER_TOKEN: ci-test-token
      DOCUMENT_SERVER_TOKEN: ci-document-token
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code_changed == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: npm ci

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.code_changed == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install data loader dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: pip install psycopg2-binary pyarrow

      - name: Build MCP servers
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          npm -w packages/mcp-shared run build
          npm -w jupyter-mcp run build
          npm -w document-mcp run build

      - name: Start services
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          docker compose up -d --build --wait
          docker compose ps

      - name: Wait for healthy services
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 30); do
            if docker compose ps | grep -q "unhealthy\|starting"; then
              echo "  attempt $i/30 — waiting..."
              sleep 5
            else
              echo "All services healthy."
              docker compose ps
              exit 0
            fi
          done
          echo "Services did not become healthy in time."
          docker compose ps
          docker compose logs
          exit 1
        timeout-minutes: 5

      - name: Load sample data into PostgreSQL
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          PGHOST=localhost PGPORT=5432 PGUSER=jupyter PGPASSWORD=ci-test-password PGDATABASE=analysis_db \
            python postgres/init/sample/load-data.py

      - name: Run MCP integration tests (excluding performance)
        if: needs.changes.outputs.code_changed == 'true'
        env:
          JUPYTER_SERVER_URL: http://localhost:8888
          DOCUMENT_SERVER_URL: http://localhost:3002
          JUPYTER_TOKEN: ci-test-token
          DOCUMENT_SERVER_TOKEN: ci-document-token
        run: |
          npx -w jupyter-mcp vitest run --config vitest.config.integration.ts --exclude '**/performance.test.ts'
          npx -w document-mcp vitest run --config vitest.config.integration.ts --exclude '**/performance.test.ts'

      - name: Run E2E tests (excluding performance)
        if: needs.changes.outputs.code_changed == 'true'
        env:
          JUPYTER_SERVER_URL: http://localhost:8888
          DOCUMENT_SERVER_URL: http://localhost:3002
          JUPYTER_TOKEN: ci-test-token
          DOCUMENT_SERVER_TOKEN: ci-document-token
        run: npx -w tests/e2e vitest run --exclude '**/performance.test.ts'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Skip (docs-only change)
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Skipped — docs-only change"

  # ──────────────────────────────────────────────
  # パフォーマンステスト（参考 — 失敗しても CI をブロックしない）
  # ──────────────────────────────────────────────
  performance-test:
    name: Performance test (informational)
    runs-on: ubuntu-latest
    needs: [changes, integration-test]
    continue-on-error: true
    env:
      DATA_ENV: sample
      POSTGRES_DB: analysis_db
      POSTGRES_USER: jupyter
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_READONLY_PASSWORD: ci-readonly-password
      JUPYTER_TOKEN: ci-test-token
      DOCUMENT_SERVER_TOKEN: ci-document-token
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code_changed == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.code_changed == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install data loader dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: pip install psycopg2-binary pyarrow

      - name: Install dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: npm ci

      - name: Build MCP servers
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          npm -w packages/mcp-shared run build
          npm -w jupyter-mcp run build
          npm -w document-mcp run build

      - name: Start services
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          docker compose up -d --build --wait
          docker compose ps

      - name: Wait for healthy services
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 30); do
            if docker compose ps | grep -q "unhealthy\|starting"; then
              echo "  attempt $i/30 — waiting..."
              sleep 5
            else
              echo "All services healthy."
              docker compose ps
              exit 0
            fi
          done
          echo "Services did not become healthy in time."
          docker compose ps
          docker compose logs
          exit 1
        timeout-minutes: 5

      - name: Load sample data into PostgreSQL
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          PGHOST=localhost PGPORT=5432 PGUSER=jupyter PGPASSWORD=ci-test-password PGDATABASE=analysis_db \
            python postgres/init/sample/load-data.py

      - name: Run performance tests
        if: needs.changes.outputs.code_changed == 'true'
        env:
          JUPYTER_SERVER_URL: http://localhost:8888
          DOCUMENT_SERVER_URL: http://localhost:3002
          JUPYTER_TOKEN: ci-test-token
          DOCUMENT_SERVER_TOKEN: ci-document-token
        run: |
          npx -w jupyter-mcp vitest run --config vitest.config.integration.ts tests/integration/performance.test.ts || true
          npx -w document-mcp vitest run --config vitest.config.integration.ts tests/integration/performance.test.ts || true
          npx -w tests/e2e vitest run tests/e2e/performance.test.ts || true

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Skip (docs-only change)
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Skipped — docs-only change"
