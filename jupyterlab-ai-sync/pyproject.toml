[build-system]
requires = [
    "jupyter_packaging~=0.12",
    "jupyterlab~=4.0",
    "setuptools>=40.8.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.jupyter-packaging.options]
skip-if-exists = ["jupyterlab-ai-sync/labextension/static/style.js"]
ensured-targets = [
    "jupyterlab-ai-sync/labextension/static/style.js",
    "jupyterlab-ai-sync/labextension/package.json"
]

[tool.jupyter-packaging.builder]
factory = "jupyter_packaging.npm_builder"

[tool.jupyter-packaging.build-args]
build_cmd = "build:labextension"
npm = ["npm"]
